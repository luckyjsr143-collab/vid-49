<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Css object fit and position</title>
    <style>
      .container {
        width: 358px;
        height: 432px;
        background-color: aquamarine;
        border: 2px solid black;
        background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5JAaDi1d45zJ5ZyBz5-XqroZLN5vqdZh-CxvivwV8UA&s=10);
        background-position: center center;
      }
      img{
        width: 358px;
        height: 432px;
        object-fit: cover;
        /* object-position: top right; */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5JAaDi1d45zJ5ZyBz5-XqroZLN5vqdZh-CxvivwV8UA&s=10" alt=""/> -->
    </div>
  </body>
</html>
